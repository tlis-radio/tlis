name: Website - development deployment (manual)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show the deployment plan without building, publishing, or deploying
        type: boolean
        default: false
      notify_discord:
        description: Post a build notification to the configured Discord thread
        type: boolean
        default: false
  # Optional automatic deployment; intentionally disabled.
  # push:
  #   branches: [dev]
  #   paths:
  #     - 'projects/cms-web/**'
  #     - 'tools/deploy/**'
  #     - '.github/workflows/cms-web-dev.yml'

permissions:
  contents: read

jobs:
  validate-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Require the dev branch
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/dev' ]; then
            echo '::error::Select the dev branch when running this workflow.'
            exit 1
          fi

  deploy:
    needs: validate-ref
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cms-web-development
    concurrency:
      group: deploy-cms-web-development
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Log in to GitHub Container Registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, publish, and request development deployment
        run: node tools/deploy/deploy.ts cms-web-dev
        env:
          DEPLOY_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          DEPLOY_NOTIFY_DISCORD: ${{ inputs.notify_discord && 'true' || 'false' }}
          DIRECTUS_URL: ${{ secrets.DIRECTUS_URL }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEV_DEPLOY_ID: ${{ secrets.DEV_DEPLOY_ID }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          DISCORD_FORUM_WEBHOOK_URL: ${{ secrets.DISCORD_FORUM_WEBHOOK_URL }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
