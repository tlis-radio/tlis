name: Component - validate selected project or library (manual)

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project to validate using its own dependencies and commands
        required: true
        default: tlis-discord-bot
        type: choice
        options:
          - cms-web
          - videostream
          - tlis-streamserver-docker
          - tlis-discord-bot
      build_images:
        description: Also build the streamserver Docker images (does not start services)
        type: boolean
        default: false
  # Optional bot-only automatic validation; intentionally disabled.
  # To use this for another component, update both paths and COMPONENT's fallback below.
  # push:
  #   branches: [main, dev, 'feature/**']
  #   paths:
  #     - 'projects/tlis-discord-bot/**'
  #     - '.github/workflows/validate-project.yml'

permissions:
  contents: read

concurrency:
  group: validate-${{ inputs.project || 'tlis-discord-bot' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run the selected project's checks
        env:
          COMPONENT: ${{ inputs.project || 'tlis-discord-bot' }}
          BUILD_IMAGES: ${{ inputs.build_images && 'true' || 'false' }}
        run: |
          node scripts/ci/validate-component.ts
