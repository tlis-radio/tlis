services:
  icecast:
    build: ./icecast # build image from directory
    restart: unless-stopped
    ports: 
      - "8000:8000"
    env_file:
      - ./auth.env
      - ./.env

  liquidsoap:
    build: ./liquidsoap
    restart: unless-stopped
    ports:
      - "8100:8100"
    env_file:
      - ./auth.env
      - ./.env
    volumes:
      - fallback-music:/music
      - replay:/replay

  music-filebrowser:
    image: filebrowser/filebrowser:s6
    restart: unless-stopped
    ports:
      - "8200:80"
    volumes:
      - fallback-music:/srv:rw
      - filebrowser-db:/database:rw
      - filebrowser-config:/config:rw

  replay-server:
    build: ./replay_server
    restart: unless-stopped
    ports: 
      - "8300:80"
    volumes:
      - replay:/replay:ro

  replay-cleanup:
    build: ./replay_cleanup
    restart: unless-stopped
    volumes:
      - replay:/replay:rw
    command: crond -f -l 2

volumes:
  fallback-music:
    # name: "fallback-music"
  replay:
  filebrowser-db:
  filebrowser-config: